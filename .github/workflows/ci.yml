name: macOS CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Swift toolchain
        run: swift --version
      - name: Determine bundle version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo 'error: release tags must use vX.Y.Z' >&2
              exit 1
            }
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo 'version=0.1.1' >> "$GITHUB_OUTPUT"
          fi
      - name: Test with fixtures and injected credentials
        run: swift test
      - name: Test bundle replacement and release failure paths
        run: Scripts/test-build-app.sh
      - name: Build and verify an ad-hoc app
        env:
          BURNBAR_ARCH: ${{ github.ref_type == 'tag' && 'universal' || 'native' }}
          BURNBAR_VERSION: ${{ steps.version.outputs.version }}
          BURNBAR_BUILD: ${{ github.run_number }}
          CODESIGN_IDENTITY: '-'
        run: |
          mkdir -p "$RUNNER_TEMP/burnbar-build"
          Scripts/build-app.sh "$RUNNER_TEMP/burnbar-build"
          if [ "$BURNBAR_ARCH" = universal ]; then
            for arch in arm64 x86_64; do
              lipo "$RUNNER_TEMP/burnbar-build/Burnbar.app/Contents/MacOS/Burnbar" -verify_arch "$arch"
            done
          fi
          mkdir -p "$RUNNER_TEMP/burnbar-artifact"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/burnbar-build/Burnbar.app" \
            "$RUNNER_TEMP/burnbar-artifact/Burnbar-$BURNBAR_VERSION-$BURNBAR_ARCH.zip"
          cp CHANGELOG.md "$RUNNER_TEMP/burnbar-artifact/CHANGELOG.md"
          cd "$RUNNER_TEMP/burnbar-artifact"
          shasum -a 256 "Burnbar-$BURNBAR_VERSION-$BURNBAR_ARCH.zip" > SHA256SUMS
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/burnbar-artifact/*.zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Burnbar-macos
          path: ${{ runner.temp }}/burnbar-artifact/*
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Burnbar-macos
          path: artifact
      - name: Verify release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.test-and-build.outputs.version }}
        run: |
          cd artifact
          sha256sum --check SHA256SUMS
          gh attestation verify "Burnbar-$RELEASE_VERSION-universal.zip" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/ci.yml" --deny-self-hosted-runners
      - name: Prepare preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.test-and-build.outputs.version }}
        run: |
          awk -v version="$RELEASE_VERSION" '
            $1 == "##" {
              if (found) exit
              if ($2 == version) { found = 1; next }
            }
            found { print }
          ' artifact/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Installation

          Download the ZIP, unzip it, and move Burnbar.app to Applications.
          Requires macOS 14 or later; supports Apple Silicon and Intel.

          This preview is not notarized. If macOS blocks it, see the
          [installation instructions](https://github.com/mindthefish/burnbar#install).
          NOTES
          gh release create "$RELEASE_TAG" "artifact/Burnbar-$RELEASE_VERSION-universal.zip" \
            artifact/SHA256SUMS \
            --repo "$GH_REPO" --verify-tag --draft --prerelease --latest=false \
            --title "Burnbar $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
